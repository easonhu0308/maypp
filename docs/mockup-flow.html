<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>懂你紫微 v2 使用者流程</title>
<style>
  body { margin:0; padding:24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#0b0b12; color:#f0e6ff; }
  h1 { font-size:20px; color:#d4b5ff; margin-bottom:8px; }
  p { font-size:14px; color:#9e92b3; margin-bottom:20px; }
  svg { width:100%; max-width:960px; height:auto; display:block; }
  .legend { margin-top:16px; font-size:13px; color:#9e92b3; }
  .legend span { display:inline-block; margin-right:16px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
</style>
</head>
<body>
<h1>懂你紫微 v2 · 使用者流程</h1>
<p>從第一次見面到每天使用，每一站都有「可以做的下一步」。</p>

<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <!-- markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c5fa6"/>
    </marker>
  </defs>

  <!-- connecting lines -->
  <g stroke="#7c5fa6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M120,80 L120,130"/>
    <path d="M120,200 L120,250"/>
    <path d="M120,320 L120,370"/>
    <path d="M260,400 L440,400"/>
    <path d="M600,400 L780,400"/>
    <path d="M840,360 L840,280 L260,280 L260,360"/>
    <path d="M440,440 L440,520 L120,520 L120,560"/>
  </g>

  <!-- nodes -->
  <g transform="translate(120,55)">
    <rect x="-80" y="-25" width="160" height="50" rx="10" fill="#2a1b4a" stroke="#b896ff" stroke-width="2"/>
    <text text-anchor="middle" y="4" fill="#f0e6ff" font-size="14" font-weight="600">歡迎頁</text>
  </g>
  <g transform="translate(120,160)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="#2a1b4a" stroke="#b896ff" stroke-width="2"/>
    <text text-anchor="middle" y="-4" fill="#f0e6ff" font-size="14" font-weight="600">建立命盤</text>
    <text text-anchor="middle" y="18" fill="#9e92b3" font-size="11">生日、時辰、目標</text>
  </g>
  <g transform="translate(120,285)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="#3d246e" stroke="#d4b5ff" stroke-width="2"/>
    <text text-anchor="middle" y="-4" fill="#f0e6ff" font-size="14" font-weight="600">今日頁</text>
    <text text-anchor="middle" y="18" fill="#9e92b3" font-size="11">每天首頁</text>
  </g>
  <g transform="translate(180,400)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="#2a1b4a" stroke="#b896ff" stroke-width="2"/>
    <text text-anchor="middle" y="-4" fill="#f0e6ff" font-size="14" font-weight="600">命盤頁</text>
    <text text-anchor="middle" y="18" fill="#9e92b3" font-size="11">格局、宮位、流年</text>
  </g>
  <g transform="translate(340,400)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="#2a1b4a" stroke="#b896ff" stroke-width="2"/>
    <text text-anchor="middle" y="-4" fill="#f0e6ff" font-size="14" font-weight="600">問事</text>
    <text text-anchor="middle" y="18" fill="#9e92b3" font-size="11">選領域、產報告</text>
  </g>
  <g transform="translate(500,400)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="#2a1b4a" stroke="#b896ff" stroke-width="2"/>
    <text text-anchor="middle" y="-4" fill="#f0e6ff" font-size="14" font-weight="600">報告列表</text>
    <text text-anchor="middle" y="18" fill="#9e92b3" font-size="11">歷史解讀</text>
  </g>
  <g transform="translate(690,400)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="#2a1b4a" stroke="#b896ff" stroke-width="2"/>
    <text text-anchor="middle" y="-4" fill="#f0e6ff" font-size="14" font-weight="600">打卡</text>
    <text text-anchor="middle" y="18" fill="#9e92b3" font-size="11">心情 + 標籤</text>
  </g>
  <g transform="translate(840,400)">
    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="#2a1b4a" stroke="#b896ff" stroke-width="2"/>
    <text text-anchor="middle" y="-4" fill="#f0e6ff" font-size="14" font-weight="600">時間軸</text>
    <text text-anchor="middle" y="18" fill="#9e92b3" font-size="11">洞察與趨勢</text>
  </g>
  <g transform="translate(120,585)">
    <rect x="-80" y="-25" width="160" height="50" rx="10" fill="#2a1b4a" stroke="#b896ff" stroke-width="2"/>
    <text text-anchor="middle" y="4" fill="#f0e6ff" font-size="14" font-weight="600">我的與隱私</text>
  </g>

  <!-- labels -->
  <text x="130" y="242" fill="#9e92b3" font-size="11">每天回來</text>
  <text x="300" y="385" fill="#9e92b3" font-size="11">探索</text>
  <text x="430" y="385" fill="#9e92b3" font-size="11">生成</text>
  <text x="600" y="385" fill="#9e92b3" font-size="11">累積</text>
  <text x="440" y="265" fill="#9e92b3" font-size="11">返回今日頁</text>
  <text x="280" y="550" fill="#9e92b3" font-size="11">設定</text>
</svg>

<div class="legend">
  <span><span class="dot" style="background:#3d246e"></span>核心頁面</span>
  <span><span class="dot" style="background:#2a1b4a"></span>輔助頁面</span>
</div>
</body>
</html>
